<div id="speedrun-bar-mockup" class="viz-carousel viz-dotted-background" aria-label="Info bar designs">
  <section data-variant="Quiet dividers" aria-label="Quiet dividers" class="preview-stage">
    <div class="product-window" data-layout="dividers"></div>
  </section>
  <section data-variant="Progress rail" aria-label="Progress rail" class="preview-stage" hidden>
    <div class="product-window" data-layout="rail"></div>
  </section>
</div>

<template id="speedrun-bar-template">
  <div class="product-nav"><span class="wordmark">2iLScout</span><i data-lucide="sun" aria-hidden="true"></i></div>
  <div class="game-bar" aria-label="Game info bar">
    <div class="destination-group">
      <i data-lucide="flag" aria-hidden="true"></i>
      <div class="destination-copy">
        <div class="destination-label">Destination</div>
        <div class="destination-name">Girls in Robotics Innovators <span>28288</span></div>
        <div class="destination-meta">Cape Town, WC, South Africa · 2025</div>
      </div>
    </div>
    <div class="path-group" aria-label="Path">
      <div class="run-path" aria-label="Recent path">
        <span class="older-stop">… <span>18763</span> <i data-lucide="chevron-right" aria-hidden="true"></i></span>
        <span>18011</span><i data-lucide="chevron-right" aria-hidden="true"></i><strong>5009</strong>
      </div>
    </div>
    <div class="stats-group" aria-label="Time and hops">
      <div class="run-stats"><span class="time"><strong>2:34</strong></span><span>6 hops</span></div>
    </div>
    <div class="action-group" aria-label="Actions">
      <div class="lifeline-controls" role="group" aria-label="Lifelines">
        <button class="icon-control cursor-interaction" type="button" aria-label="Radar" data-tooltip="Radar"><i data-lucide="radar" aria-hidden="true"></i></button>
        <button class="icon-control cursor-interaction" type="button" aria-label="Crosshair, used" data-tooltip="Crosshair · Used" disabled><i data-lucide="crosshair" aria-hidden="true"></i></button>
        <button class="icon-control cursor-interaction" type="button" aria-label="Beacon" data-tooltip="Beacon"><i data-lucide="radio-tower" aria-hidden="true"></i></button>
      </div>
      <button class="give-up cursor-interaction" type="button">Give up</button>
    </div>
  </div>
  <div class="team-page">
    <div class="team-heading"><strong>Helios</strong><span>5009</span></div>
    <div class="page-meta">Edmonton, AB, Canada · Rookie year 2011</div>
    <div class="event-heading">Alberta Championship</div>
    <div class="page-meta">March 7–8, 2025 · Edmonton, AB, Canada</div>
  </div>
</template>

<style>
  #speedrun-bar-mockup {
    --run-bg: light-dark(#f7f5f9, #121015);
    --run-surface: light-dark(#ffffff, #1b1720);
    --run-text: light-dark(#251e2c, #f4f1f7);
    --run-muted: light-dark(#746d7c, #aaa3b2);
    --run-divider: light-dark(#ddd7e3, #3b3343);
    --run-accent: light-dark(#824dbd, #bc92f4);
    --run-hover: light-dark(#f1edf6, #292230);
    font-family: Inter, system-ui, sans-serif;
    color: var(--run-text);
  }
  #speedrun-bar-mockup * { box-sizing: border-box; }
  #speedrun-bar-mockup .preview-stage {
    min-height: 360px;
    padding: 32px 0 20px;
  }
  #speedrun-bar-mockup .product-window {
    width: 100%;
    margin: auto;
    container-type: inline-size;
    background: var(--run-bg);
    color: var(--run-text);
  }
  #speedrun-bar-mockup .product-window.mobile { max-width: 390px; }
  #speedrun-bar-mockup .product-nav {
    height: 48px;
    padding: 0 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--run-divider);
  }
  #speedrun-bar-mockup .wordmark { font-size: 17px; font-weight: 700; }
  #speedrun-bar-mockup .product-nav svg { width: 18px; height: 18px; color: var(--run-muted); }
  #speedrun-bar-mockup .game-bar {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto auto auto;
    align-items: center;
    gap: 20px;
    padding: 14px 20px;
    background: var(--run-surface);
    border-bottom: 1px solid var(--run-divider);
  }
  #speedrun-bar-mockup .destination-group { display: flex; align-items: center; gap: 12px; min-width: 0; }
  #speedrun-bar-mockup .destination-group > svg { color: var(--run-accent); width: 22px; height: 22px; flex: none; }
  #speedrun-bar-mockup .destination-copy { min-width: 0; }
  #speedrun-bar-mockup .destination-label { color: var(--run-muted); font-size: 11px; margin-bottom: 4px; }
  #speedrun-bar-mockup .destination-name { font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #speedrun-bar-mockup .destination-name span { font-size: 12px; font-weight: 400; color: var(--run-muted); }
  #speedrun-bar-mockup .destination-meta { color: var(--run-muted); font-size: 11px; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #speedrun-bar-mockup .path-group,
  #speedrun-bar-mockup .stats-group { padding-left: 20px; border-left: 1px solid var(--run-divider); }
  #speedrun-bar-mockup .run-path { display: flex; align-items: center; gap: 6px; font-size: 12px; white-space: nowrap; color: var(--run-muted); }
  #speedrun-bar-mockup .run-path strong { color: var(--run-text); font-weight: 600; }
  #speedrun-bar-mockup .run-path svg { width: 13px; height: 13px; }
  #speedrun-bar-mockup .older-stop { display: flex; align-items: center; gap: 6px; }
  #speedrun-bar-mockup .run-stats { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; font-size: 12px; white-space: nowrap; color: var(--run-muted); font-variant-numeric: tabular-nums; }
  #speedrun-bar-mockup .time { display: flex; align-items: center; gap: 6px; }
  #speedrun-bar-mockup .time strong { font-weight: 600; color: var(--run-text); }
  #speedrun-bar-mockup .action-group { display: flex; align-items: center; gap: 12px; padding-left: 20px; border-left: 1px solid var(--run-divider); }
  #speedrun-bar-mockup .lifeline-controls { display: flex; align-items: center; gap: 2px; }
  #speedrun-bar-mockup button { font-family: inherit; }
  #speedrun-bar-mockup .icon-control { width: 32px; height: 40px; padding: 0; border: 0; background: transparent; color: var(--run-accent); display: flex; align-items: center; justify-content: center; border-radius: 6px; }
  #speedrun-bar-mockup .icon-control svg { width: 21px; height: 21px; }
  #speedrun-bar-mockup .icon-control:hover:not(:disabled) { background: var(--run-hover); }
  #speedrun-bar-mockup .icon-control:disabled { color: var(--run-muted); opacity: 0.5; }
  #speedrun-bar-mockup .give-up { color: var(--run-muted); background: transparent; border: 1px solid var(--run-divider); padding: 7px 12px; border-radius: 999px; font-size: 12px; white-space: nowrap; }
  #speedrun-bar-mockup .give-up:hover { color: var(--run-text); background: var(--run-hover); }
  #speedrun-bar-mockup .team-page { padding: 30px 24px; min-height: 200px; }
  #speedrun-bar-mockup .team-heading { display: flex; align-items: baseline; gap: 12px; font-size: 23px; }
  #speedrun-bar-mockup .team-heading strong { font-weight: 600; }
  #speedrun-bar-mockup .team-heading span { color: var(--run-muted); font-size: 16px; }
  #speedrun-bar-mockup .page-meta { margin-top: 6px; font-size: 12px; color: var(--run-muted); }
  #speedrun-bar-mockup .event-heading { margin-top: 28px; font-size: 16px; font-weight: 600; }
  #speedrun-bar-mockup [data-layout="dividers"] .stats-group { padding-left: 0; border-left: 0; }
  #speedrun-bar-mockup [data-layout="dividers"] .path-group,
  #speedrun-bar-mockup [data-layout="dividers"] .action-group { position: relative; border-left: 0; }
  #speedrun-bar-mockup [data-layout="dividers"] .path-group::before,
  #speedrun-bar-mockup [data-layout="dividers"] .action-group::before {
    content: "";
    position: absolute;
    left: 0;
    top: 50%;
    width: 1px;
    height: 40px;
    transform: translateY(-50%);
    background: var(--run-divider);
  }
  #speedrun-bar-mockup [data-layout="rail"] .game-bar { grid-template-columns: minmax(0, 1fr) auto auto; padding-bottom: 0; row-gap: 14px; }
  #speedrun-bar-mockup [data-layout="rail"] .destination-group { grid-column: 1; grid-row: 1; }
  #speedrun-bar-mockup [data-layout="rail"] .stats-group { grid-column: 2; grid-row: 1; }
  #speedrun-bar-mockup [data-layout="rail"] .action-group { grid-column: 3; grid-row: 1; }
  #speedrun-bar-mockup [data-layout="rail"] .path-group { grid-column: 1 / -1; grid-row: 2; border-left: 0; border-top: 1px solid var(--run-divider); padding: 10px 0; }
  @container (min-width: 601px) and (max-width: 850px) {
    #speedrun-bar-mockup [data-layout="dividers"] .game-bar { grid-template-columns: minmax(0, 1fr) auto auto; }
    #speedrun-bar-mockup [data-layout="dividers"] .destination-group { grid-column: 1 / -1; border-bottom: 1px solid var(--run-divider); padding-bottom: 12px; }
    #speedrun-bar-mockup [data-layout="dividers"] .path-group { border-left: 0; padding-left: 0; }
    #speedrun-bar-mockup [data-layout="dividers"] .path-group::before { display: none; }
  }
  @container (max-width: 600px) {
    #speedrun-bar-mockup .game-bar { grid-template-columns: minmax(0, 1fr) auto; gap: 12px; padding: 12px; }
    #speedrun-bar-mockup .destination-group { grid-column: 1 / -1; padding-bottom: 12px; border-bottom: 1px solid var(--run-divider); }
    #speedrun-bar-mockup .destination-meta { display: none; }
    #speedrun-bar-mockup .destination-name { font-size: 14px; }
    #speedrun-bar-mockup .path-group { grid-column: 1 / -1; grid-row: 2; border: 0; border-bottom: 1px solid var(--run-divider); padding: 0 0 12px; }
    #speedrun-bar-mockup [data-layout="dividers"] .path-group { border-bottom: 0; }
    #speedrun-bar-mockup [data-layout="dividers"] .path-group::before { display: none; }
    #speedrun-bar-mockup .stats-group { grid-column: 1; grid-row: 3; border: 0; padding: 0; }
    #speedrun-bar-mockup .older-stop { display: none; }
    #speedrun-bar-mockup .action-group { grid-column: 2; grid-row: 3; padding-left: 12px; gap: 6px; }
    #speedrun-bar-mockup .icon-control { width: 36px; height: 44px; }
    #speedrun-bar-mockup .give-up { padding: 7px 9px; }
    #speedrun-bar-mockup .run-stats { align-items: flex-start; }
    #speedrun-bar-mockup [data-layout="rail"] .destination-group { border: 0; padding: 0; }
    #speedrun-bar-mockup [data-layout="rail"] .game-bar { grid-template-columns: minmax(0, 1fr) auto; }
    #speedrun-bar-mockup [data-layout="rail"] .destination-group { grid-column: 1 / -1; }
    #speedrun-bar-mockup [data-layout="rail"] .stats-group { grid-column: 1; grid-row: 2; }
    #speedrun-bar-mockup [data-layout="rail"] .action-group { grid-column: 2; grid-row: 2; }
    #speedrun-bar-mockup [data-layout="rail"] .path-group { grid-row: 3; }
    #speedrun-bar-mockup .team-page { padding: 24px 16px; }
  }
</style>

<script>
  (() => {
    const root = document.getElementById("speedrun-bar-mockup");
    const template = document.getElementById("speedrun-bar-template");
    for (const product of root.querySelectorAll(".product-window")) {
      product.append(template.content.cloneNode(true));
      const state = { mobile: false };
      const render = () => product.classList.toggle("mobile", state.mobile);
      render();
      if (globalThis.Tweak) {
        const tweak = new Tweak({ container: product, onChange: render });
        tweak.addToggle(state, "mobile", { label: "Mobile preview" });
      }
    }
    if (globalThis.lucide) lucide.createIcons({ attrs: { width: 18, height: 18 } });
  })();
</script>
