query EventLivestreams($season: Int!, $code: String!) {
    eventByCode(season: $season, code: $code) {
        season
        code
        liveStreamURL
        livestreamsByDay {
            day
            liveStreamURL
        }
        relatedEvents {
            code
            divisionCode
            liveStreamURL
            livestreamsByDay {
                day
                liveStreamURL
            }
        }
    }
}
