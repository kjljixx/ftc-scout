query Team($number: Int!, $season: Int!, $overall: Boolean!) {
    teamByNumber(number: $number) {
        name
        number
        website
        name
        location {
            city
            state
            country
        }
        schoolName
        sponsors
        rookieYear
        activeSeasons
        quickStatsHistory @include(if: $overall) {
            season
            tot {
                value
                rank
            }
            count
        }
        quickStats(season: $season) @skip(if: $overall) {
            tot {
                value
                rank
                stdErr
            }
            auto {
                value
                rank
            }
            dc {
                value
                rank
            }
            eg {
                value
                rank
            }
            count
        }
        events(season: $season) @skip(if: $overall) {
            season
            eventCode
            teamNumber
            stats {
                __typename
                ...TeamPageStats
            }
            awards {
                season
                eventCode
                teamNumber
                type
                placement
                personName
            }
            event {
                type
                ...BasicEventInfo
                relatedEvents {
                    season
                    code
                    name
                }
            }
            matches {
                season
                eventCode
                matchId
                station
                alliance
                match {
                    ...FullMatch
                }
            }
        }
    }
}
