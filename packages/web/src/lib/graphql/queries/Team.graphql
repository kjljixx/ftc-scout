query Team($number: Int!, $season: Int!, $overall: Boolean!, $lite: Boolean!) {
    teamByNumber(number: $number) {
        name
        number
        website
        name
        location {
            city
            state
            country
        }
        schoolName
        sponsors
        rookieYear
        activeSeasons
        quickStatsHistory @include(if: $overall) {
            season
            tot {
                value
                rank
            }
            count
        }
        quickStats(season: $season) @skip(if: $overall) {
            tot {
                value
                rank
                stdErr
            }
            auto {
                value
                rank
            }
            dc {
                value
                rank
            }
            eg {
                value
                rank
            }
            count
        }
        events(season: $season) @skip(if: $overall) {
            season
            eventCode
            teamNumber
            stats {
                __typename
                ...TeamPageStats
            }
            awards {
                season
                eventCode
                teamNumber
                type
                placement
                personName
            }
            event {
                ...BasicEventInfo
                teams @skip(if: $lite) {
                    season
                    eventCode
                    teamNumber
                    team {
                        number
                        name
                        location {
                            city
                            state
                            country
                        }
                    }
                    stats {
                        ...FullStats
                    }
                }
                relatedEvents {
                    season
                    code
                    name
                    teams @skip(if: $lite) {
                        season
                        eventCode
                        teamNumber
                        team {
                            number
                            name
                            location {
                                city
                                state
                                country
                            }
                        }
                        stats {
                            ...FullStats
                        }
                    }
                }
                matches @skip(if: $lite) {
                    ...FullMatch
                }
            }
            matches {
                season
                eventCode
                matchId
                station
                alliance
                match {
                    ...FullMatch
                }
            }
        }
    }
}
