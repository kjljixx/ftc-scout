query HomeTeam($number: Int!, $season: Int!) {
    teamByNumber(number: $number) {
        number
        name
        activeSeasons
        events(season: $season) {
            season
            eventCode
            teamNumber
            event {
                season
                code
                name
                start
                remote
                allianceCount
                started
                published
                timezone
                type
                relatedEvents {
                    season
                    code
                    name
                }
            }
        }
    }
}
